name: Bug report
description: Report a problem with the Mobile Joe iOS SDK.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't include API keys or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps that reproduce the problem.
      placeholder: |
        1. Configure the SDK with …
        2. Show `FeaturePlansView` …
        3. …
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: iOS 26.0
    validations:
      required: true
  - type: input
    id: xcode-version
    attributes:
      label: Xcode version
      placeholder: Xcode 26.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output or error messages.
      render: text
